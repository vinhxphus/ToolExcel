<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Smart Formatter</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="module" crossorigin src="/ToolExcel/assets/index-CCUgfA7a.js"></script>
    <link rel="stylesheet" crossorigin href="/ToolExcel/assets/index-PmsNbaaX.css">
  </head>
  <body>
    <div class="app-shell">
      <main class="content">
        <section class="tool-section">
          <p class="section-label">Làm sạch dữ liệu</p>
          <div class="tool-grid">
            <button class="tool primary" data-action="duplicate">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="10" height="10" rx="2"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
              </span>
              <span class="label">Hightlight trùng lặp</span>
            </button>

            <button class="tool" data-action="trim">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l-3 4 3 4"/><path d="M13 6l3 4-3 4"/><line x1="9" y1="10" x2="11" y2="10"/></svg>
              </span>
              <span class="label">Xoá Khoảng trắng thừa</span>
            </button>

            <button class="tool" data-action="upper">
              <span class="icon-tile"><span class="icon-text">A</span></span>
              <span class="label">Chữ HOA</span>
            </button>

            <button class="tool" data-action="lower">
              <span class="icon-tile"><span class="icon-text">a</span></span>
              <span class="label">Chữ thường</span>
            </button>

            <button class="tool" data-action="title">
              <span class="icon-tile"><span class="icon-text">Aa</span></span>
              <span class="label">Hoa đầu từ</span>
            </button>

            <button class="tool" data-action="formulavalue">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="9" width="12" height="8" rx="1.5"/><path d="M6.5 9V6a3.5 3.5 0 0 1 7 0v3"/></svg>
              </span>
              <span class="label">Cố định giá trị</span>
            </button>

            <button class="tool" data-action="copy">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="3 2.2"><rect x="3.5" y="3.5" width="13" height="13" rx="2"/></svg>
              </span>
              <span class="label">Sao chép</span>
            </button>

            <button class="tool" data-action="pastevalues">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="4" width="12" height="13" rx="1.5"/><rect x="7" y="2.3" width="6" height="3" rx="1"/><text x="10" y="13" text-anchor="middle" font-size="5.5" fill="currentColor" stroke="none" font-family="Segoe UI, sans-serif">123</text></svg>
              </span>
              <span class="label">Dán giá trị</span>
            </button>

            <button class="tool" data-action="pasteformulas">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="4" width="12" height="13" rx="1.5"/><rect x="7" y="2.3" width="6" height="3" rx="1"/><text x="10" y="13.5" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-style="italic" font-family="Georgia, serif">fx</text></svg>
              </span>
              <span class="label">Dán công thức</span>
            </button>
          </div>
        </section>

        <section class="tool-section">
          <p class="section-label">Định dạng &amp; hiển thị</p>
          <div class="tool-grid">
            <button class="tool" data-action="border">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="1.5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="10" y1="3" x2="10" y2="17"/></svg>
              </span>
              <span class="label">Kẻ viền table</span>
            </button>

            <button class="tool" data-action="height">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="4" x2="17" y2="4"/><line x1="3" y1="16" x2="17" y2="16"/><path d="M10 6v8"/><path d="M7.5 8.5L10 6l2.5 2.5"/><path d="M7.5 11.5L10 14l2.5-2.5"/></svg>
              </span>
              <span class="label">Cao dòng</span>
            </button>

            <button class="tool" data-action="center">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="5" x2="16" y2="5"/><line x1="6" y1="10" x2="14" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
              </span>
              <span class="label">Center across selection</span>
            </button>

            <button class="tool" data-action="justify">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
              </span>
              <span class="label">Justify</span>
            </button>

            <button class="tool" data-action="clear">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l7-7 3 3-7 7H6v-3z"/><line x1="4" y1="17" x2="9" y2="17"/></svg>
              </span>
              <span class="label">Xoá định dạng</span>
            </button>

            <button class="tool" data-action="zebra">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="3.5" rx="0.8" fill="currentColor" opacity="0.35" stroke="none"/><rect x="3" y="8.5" width="14" height="3.5" rx="0.8"/><rect x="3" y="13.5" width="14" height="3.5" rx="0.8" fill="currentColor" opacity="0.35" stroke="none"/></svg>
              </span>
              <span class="label">Màu xen kẽ</span>
            </button>
          </div>
        </section>

        <section class="tool-section">
          <p class="section-label">In ấn</p>
          <div class="tool-grid">
            <button class="tool" data-action="printarea">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="10" height="5" rx="1"/><rect x="3" y="7" width="14" height="7" rx="1.5"/><rect x="6" y="12" width="8" height="6" rx="1"/></svg>
              </span>
              <span class="label">Set vùng in</span>
            </button>

            <button class="tool" data-action="printtitle">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="2" width="10" height="7" rx="1"/><line x1="3" y1="4.5" x2="13" y2="4.5"/><rect x="7" y="10" width="10" height="7" rx="1"/><line x1="7" y1="12.5" x2="17" y2="12.5"/></svg>
              </span>
              <span class="label">Lặp tiêu đề</span>
            </button>

            <button class="tool" data-action="pagenumber">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="2" width="12" height="16" rx="1.5"/><text x="10" y="13.5" text-anchor="middle" font-size="6.5" fill="currentColor" stroke="none" font-family="Segoe UI, sans-serif">1</text></svg>
              </span>
              <span class="label">Đánh số trang</span>
            </button>

            <button class="tool" data-action="printheader">
              <span class="icon-tile">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="2" width="12" height="16" rx="1.5"/><line x1="4" y1="6" x2="16" y2="6" stroke-width="2.4"/></svg>
              </span>
              <span class="label">Chèn header in</span>
            </button>
          </div>
        </section>

        <section class="tool-section">
          <p class="section-label">Toàn bộ workbook</p>
          <button class="tool wide" data-action="font">
            <span class="icon-tile">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="14" height="10" rx="1.5"/><line x1="3" y1="16" x2="9" y2="16"/><line x1="11" y1="16" x2="17" y2="16"/></svg>
            </span>
            <span class="label-group">
              <span class="label">Font Cambria</span>
            </span>
          </button>
        </section>
      </main>

      <div class="status-bar">
        <span class="dot"></span>
        <p id="status">Sẵn sàng. Chọn vùng dữ liệu trong Excel.</p>
      </div>
    </div>

  </body>
</html>
